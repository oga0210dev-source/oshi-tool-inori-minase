{% extends "templates/commons/base.html" %}

{% block title %}
費用編集
{% endblock %}

{% block css %}
<link rel="stylesheet" href="/static/css/home/meeting/history_expense_edit.css">
{% endblock %}

{% block content %}

<div class="background">

    <a href="/home/meeting/history/detail/{{ expense.meeting_id }}" class="back-link">
        ← 参加履歴詳細
    </a>

    <div class="page-scroll">
        <div class="container">

            <div class="detail-card">

                <div class="group-title">
                    費用編集
                </div>

                <form method="post" data-unsaved-check="true">

                    <div class="form-group">
                        <label>
                            費用種類
                        </label>

                        <select name="expense_type_id">
                            {% for expense_type in expense_types %}
                            <option value="{{ expense_type.expense_type_id }}"
                                {% if expense_type.expense_type_id == expense.expense_type_id %}
                                    selected
                                {% endif %}
                            >
                                {{ expense_type.expense_type_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            金額
                        </label>

                        <input
                            type="number"
                            name="amount"
                            value="{{ expense.amount }}"
                            min="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            メモ
                        </label>

                        <textarea
                            name="memo"
                            rows="4"
                            placeholder="内容を入力してください"
                        >{{ expense.memo or "" }}</textarea>
                    </div>

                    <button class="save-btn">
                        保存
                    </button>

                </form>

            </div>

        </div>
    </div>

</div>

{% endblock %}
