<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/img/logo.png" type="image/png">

    <title>回収済み楽曲</title>

    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/home/live/collected_song.css">
</head>

<body>
    <div class="background">
        <a href="/home/live" class="live-link">
            ← ライブ
        </a>

            回収済み楽曲

        <div>

        <div class="collection-menu">

            <a href="/home/live/collected_song/collected"
               class="menu-btn">
                回収済み
            </a>

            <a href="/home/live/collected_song/uncollected"
               class="menu-btn">
                未回収
            </a>

            <a href="/home/live/collected_song/appearance"
               class="menu-btn">
                ライブ登場曲
            </a>
        </div>

</html>
