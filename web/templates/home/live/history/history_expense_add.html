<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/logo.png" type="image/png">

    <title>費用追加</title>

    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/home/live/history_expense_add.css">
</head>

<body>
<div class="background">

    <a href="/home/live/history/detail/{{ live_id }}" class="live-link">
        ← 参加履歴詳細
    </a>

    <div class="page-scroll">
        <div class="container">

            <div class="detail-card">

                <div class="group-title">
                    費用追加
                </div>

                <form method="post">

                    <div class="form-group">
                        <label>
                            費用種類
                        </label>

                        <select name="expense_type_id" required>
                            <option value="">
                                選択してください
                            </option>

                            {% for expense_type in expense_types %}
                            <option value="{{ expense_type.expense_type_id }}">
                                {{ expense_type.expense_type_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            金額
                        </label>

                        <input
                            type="number"
                            name="amount"
                            min="0"
                            placeholder="金額を入力"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            メモ
                        </label>

                        <textarea
                            name="memo"
                            placeholder="内容を入力してください"
                            rows="3"
                        ></textarea>
                    </div>

                    <button type="submit" class="save-btn">
                        💰 登録
                    </button>

                </form>

            </div>

        </div>
    </div>

</div>
</body>
</html>
