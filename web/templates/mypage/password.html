{% extends "templates/commons/base.html" %}

{% block title %}パスワード変更{% endblock %}

{% block css %}
    <link rel="stylesheet" href="/static/css/password/change.css">
{% endblock %}

{% block content %}
    <div class="password-page">
        <h1>パスワード変更</h1>

    <form method="post" class="password-form">
        <div class="form-group">
            <label for="old-password">現在のパスワード</label>
            <input type="password" id="old-password" name="old_password" autocomplete="current-password" required>
        </div>

        <div class="form-group">
            <label for="new-password">新しいパスワード</label>
            <input type="password" id="new-password" name="new_password" autocomplete="new-password" required>
        </div>

        <div class="form-group">
            <label for="confirm-password">確認</label>
            <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required>
        </div>

        <button type="submit" class="password-submit">変更する</button>
    </form>

    </div>
{% endblock %}

{% block script %}
    <script src="/static/js/common.js"></script>
    {% if message %}
        <script>
            showToast("{{ message }}");
        </script>
    {% endif %}
{% endblock %}
