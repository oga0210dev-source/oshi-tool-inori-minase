{% extends "templates/commons/base.html" %}

{% block title %}パスワード変更{% endblock %}

{% block content %}
<div class="page">
    <h2>パスワード変更</h2>

    <form method="post" class="password-form">
        <div class="form-group">
            <label>現在のパスワード</label>
            <input
                type="password"
                name="old_password"
                value="{{ old_password or '' }}">
        </div>

        <div class="form-group">
            <label>新しいパスワード</label>
            <input
                type="password"
                name="new_password"
                value="{{ new_password or '' }}">
        </div>

        <div class="form-group">
            <label>確認</label>
            <input
                type="password"
                name="confirm_password"
                value="{{ confirm_password or '' }}">
        </div>

        <button type="submit">
            変更する
        </button>
    </form>
</div>
{% endblock %}

{% block script %}
<script src="/static/js/common.js"></script>

{% if message %}
<script>
    showToast("{{ message }}");
</script>
{% endif %}
{% endblock %}
