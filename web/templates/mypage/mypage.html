<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/static/img/logo.png" type="image/png">
        <title>推し活オールインワン</title>
        <link rel="stylesheet" href="/static/css/common.css">
        <link rel="stylesheet" href="/static/css/mypage/mypage.css">
    </head>

    <body>
        <div class="background">
            {% include "templates/commons/header.html" %}
            <div class="page">

                <h1>マイページ</h1>

                <!-- ユーザー情報 -->
                <form action="/mypage/update" method="post" enctype="multipart/form-data">
                    <!-- プロフィール画像 -->
                    <div class="profile-area">
                        <img
                            id="profile-preview"
                            class="profile-image"
                            src="{{ user.profile_image or '/static/img/profile/default.png' }}">

                        <input
                            id="profile-image"
                            name="profile_image"
                            type="file"
                            accept="image/*"
                            class="hidden">
                    </div>
                    <div class="info-list">
                        <div class="info-item">
                            <div class="label">ユーザーID</div>
                            <div class="value">{{ user.user_id }}</div>
                        </div>

                        <div class="info-item">
                            <div class="label">名前</div>
                            <div class="value"><input id="user_name" class="edit-item" name="user_name" value="{{ user.user_name }}" readonly></div>
                        </div>

                        <div class="info-item">
                            <div class="label">いのりまち入会日</div>
                            <div class="value"><input id="member_since" class="edit-item" name="member_since" type="date" value="{{ user.member_since or '' }}" readonly></div>
                        </div>

                        <div class="info-item">
                            <div class="label">メールアドレス</div>
                            <div class="value"><input id="email" class="edit-item" name="email" type="email" value="{{ user.email or '' }}" readonly></div>
                        </div>

                        <div class="info-item">
                            <div class="label">性別</div>
                            <div class="value">
                                <select
                                    id="gender"
                                    class="edit-item"
                                    name="gender"
                                    disabled>
                                    <option value="" {% if not user.gender %}selected{% endif %}>未設定</option>
                                    <option value="男性"{% if user.gender == "男性" %}selected{% endif %}>男性</option>
                                    <option value="女性" {% if user.gender == "女性" %}selected{% endif %}>女性</option>
                                </select>
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="label">誕生日</div>
                            <div class="value"><input id="birthday" class="edit-item" name="birthday" type="date" value="{{ user.birthday or '' }}" readonly></div>
                        </div>
                    </div>

                    <div class="button-area">
                        <button type="button" id="edit-btn">編集</button>

                        <button type="submit" id="save-btn" class="hidden">保存</button>

                        <button type="button" id="cancel-btn" class="hidden">キャンセル</button>
                    </div>

                    <div class="withdraw-area">
                        <a href="/withdraw" class="withdraw-link">退会する</a>
                    </div>

                </form>
                <script src="/static/js/mypage/mypage.js"></script>
            </div>
        </div>
    </body>
</html>
