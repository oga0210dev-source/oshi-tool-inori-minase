<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="icon"
          href="/static/img/logo.png"
          type="image/png">

    <title>
        {% if mode == "create" %}
        記念日 新規登録
        {% else %}
        記念日 編集
        {% endif %}
    </title>

    <link rel="stylesheet"
          href="/static/css/common.css">

    <link rel="stylesheet"
          href="/static/css/admin/master/admin-common.css">

    <link rel="stylesheet"
          href="/static/css/admin/master/oshi/oshi_anniversary.css">
</head>

<body class="{{ font_class }}">

<div class="container">

    <div class="page-header">

        <a href="/admin/master/oshi_anniversary"
           class="master-link">
            ← 記念日管理
        </a>

        <h1 class="page-title">

            {% if mode == "create" %}
            記念日 新規登録
            {% else %}
            記念日 編集
            {% endif %}

        </h1>

    </div>


    <form
        method="post"
        action="{% if mode == 'create' %}/admin/master/oshi_anniversary/create{% else %}/admin/master/oshi_anniversary/edit/{{ anniversary.anniversary_id }}{% endif %}"
        class="master-form"
        data-unsaved-check="true">


        <!-- 記念日名 -->

        <div class="form-group">

            <label for="anniversary_name">
                記念日名
            </label>

            <input
                type="text"
                id="anniversary_name"
                name="anniversary_name"
                value="{{ anniversary.anniversary_name if anniversary else '' }}"
                maxlength="100"
                required>

        </div>


        <!-- 記念日 -->

        <div class="form-group">

            <label for="anniversary_date">
                記念日
            </label>

            <input
                type="date"
                id="anniversary_date"
                name="anniversary_date"
                value="{{ anniversary.anniversary_date if anniversary and anniversary.anniversary_date else '' }}"
                required>

        </div>


        <!-- 説明 -->

        <div class="form-group">

            <label for="description">
                説明
                <span class="optional">任意</span>
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
            >{{ anniversary.description if anniversary and anniversary.description else "" }}</textarea>

        </div>


        <!-- 公開フラグ -->

        <div class="form-group checkbox-group">

            <label>

                <input
                    type="checkbox"
                    name="public_flag"
                    {% if not anniversary or anniversary.public_flag %}
                    checked
                    {% endif %}>

                公開する

            </label>

        </div>


        <!-- ボタン -->

        <div class="form-actions">

            <a
                href="/admin/master/oshi_anniversary"
                class="cancel-btn">
                キャンセル
            </a>

            <button
                type="submit"
                class="save-btn">
                保存
            </button>

        </div>

    </form>

</div>

</body>
</html>
