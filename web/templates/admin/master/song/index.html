<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/logo.png" type="image/png">

    <title>推し活オールインワン</title>

    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/admin/master/song/song.css">
</head>

<body class="admin-page">

{% include "templates/commons/header.html" %}

<div class="container">

    <h1 class="page-title">
        曲管理
    </h1>

    <!-- 新規登録 -->
    <a href="/admin/master/song/create" class="action-btn">
        新規登録
    </a>

    <!-- 検索・ソート -->
    <div class="search-area">
        <form method="get">
            <input type="text"
                   name="keyword"
                   placeholder="曲名・アルバム名で検索"
                   value="{{ keyword or '' }}">
            <select name="sort">
                <option value="album" {% if sort == "album" %}selected{% endif %}>
                    アルバム順
                </option>

                <option value="song" {% if sort == "song" %}selected{% endif %}>
                    曲名順
                </option>

                <option value="release_desc" {% if sort == "release_desc" %}selected{% endif %}>
                    リリース日（新しい順）
                </option>

                <option value="release_asc" {% if sort == "release_asc" %}selected{% endif %}>
                    リリース日（古い順）
                </option>

                <option value="updated" {% if sort == "updated" %}selected{% endif %}>
                    更新日順
                </option>
            </select>
            <button type="submit" class="search-btn">
                検索
            </button>
        </form>
    </div>

    <!-- 曲一覧 -->
    <div class="album-list">
        {% for album in albums %}
        <div class="album-block">
            <h2 class="album-title">
                {{ album.album_name }}
            </h2>

            {% for song in album.songs %}
            <div class="song-row">
                <div class="song-name">
                    {% if song.display_order %}
                        {{ song.display_order }}.
                    {% endif %}
                    {{ song.song_name }}
                </div>

                <div class="song-action">
                    <a href="/admin/master/song/edit/{{ song.song_id }}"
                       class="edit-btn">
                        編集
                    </a>


                    <a href="/admin/master/song/delete/{{ song.song_id }}"
                       class="delete-btn"
                       onclick="return confirm('この曲を削除しますか？');">
                        削除
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>

        {% else %}
        <p class="empty-message">
            登録されている曲はありません。
        </p>
        {% endfor %}
    </div>

</div>
</body>
</html>
