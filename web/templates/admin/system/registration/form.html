<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/logo.png" type="image/png">

    <title>新規登録設定 - 推し活オールインワン</title>

    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/admin/master/admin-common.css">
    <link rel="stylesheet" href="/static/css/admin/system/registration.css">
</head>

<body>

<div class="container">

    <div class="page-header">

        <a href="/admin/master" class="master-link">
            ← 管理マスタ
        </a>

        <h1 class="page-title">
            新規登録設定
        </h1>

    </div>

    <form
        method="post"
        action="/admin/system/registration"
        class="registration-form"
    >

        <div class="form-group">

            <label>
                新規登録方式
            </label>

            <div class="registration-mode-list">

                <label class="registration-mode-option">

                    <input
                        type="radio"
                        name="registration_mode"
                        value="0"
                        {% if registration_mode == "0" %}checked{% endif %}
                    >

                    <span class="registration-mode-content">

                        <span class="registration-mode-title">
                            登録停止
                        </span>

                        <span class="registration-mode-description">
                            新規ユーザー登録を受け付けません。
                        </span>

                    </span>

                </label>


                <label class="registration-mode-option">

                    <input
                        type="radio"
                        name="registration_mode"
                        value="1"
                        {% if registration_mode == "1" %}checked{% endif %}
                    >

                    <span class="registration-mode-content">

                        <span class="registration-mode-title">
                            一般登録
                        </span>

                        <span class="registration-mode-description">
                            誰でも新規登録できます。
                        </span>

                    </span>

                </label>


                <label class="registration-mode-option">

                    <input
                        type="radio"
                        name="registration_mode"
                        value="2"
                        {% if registration_mode == "2" %}checked{% endif %}
                    >

                    <span class="registration-mode-content">

                        <span class="registration-mode-title">
                            招待制
                        </span>

                        <span class="registration-mode-description">
                            招待コードを持っているユーザーのみ登録できます。
                        </span>

                    </span>

                </label>

            </div>

        </div>


        <button type="submit" class="action-btn">
            保存
        </button>

    </form>

</div>
</div>

<div id="toast"></div>

<script src="/static/js/common.js"></script>

{% if message %}
<script>
    showToast({{ message | tojson }});
</script>
{% endif %}

</body>
</html>
